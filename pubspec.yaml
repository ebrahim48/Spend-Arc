name: finance_tracker
description: Personal Finance Tracker — Clean Architecture + Animations + BLoC + Offline-First
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # DI
  get_it: ^7.7.0
  injectable: ^2.4.4

  # BLoC
  flutter_bloc: ^8.1.6
  bloc: ^8.1.4
  equatable: ^2.0.5

  # Functional Programming
  dartz: ^0.10.1

  # Local Storage
  sqflite: ^2.3.3+1
  path: ^1.9.0
  shared_preferences: ^2.3.2

  # Network
  dio: ^5.7.0
  connectivity_plus: ^6.1.0

  # Navigation
  go_router: ^14.6.2

  # Utils
  uuid: ^4.5.1
  intl: ^0.19.0
  rxdart: ^0.27.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  bloc_test: ^9.1.7
  mocktail: ^1.0.4
  injectable_generator: ^2.6.2
  build_runner: ^2.4.13
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  shaders:
    - shaders/aurora.frag
